    <rect x="32" y="482" width="420" height="8" rx="4" fill="#F1F5F9"/>
    <rect x="32" y="482" width="300" height="8" rx="4" fill="#DB2777"/>
    <text x="32" y="502" fill="#64748B" font-size="9">R6,450 of R9,000 · 87 backers · 12 days left</text>
