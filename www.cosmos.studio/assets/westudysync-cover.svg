    <text y="144" fill="#fff" font-size="42" font-weight="800" letter-spacing="-1.4">system to you.</text>
    <text y="192" fill="#F9C846" font-size="42" font-weight="800" letter-spacing="-1.4">So we did.</text>

    <text y="238" fill="#D8F3EF" font-size="16">The complete South African education journey — from</text>
    <text y="262" fill="#D8F3EF" font-size="16">choosing subjects to graduating, or building a business</text>
    <text y="286" fill="#D8F3EF" font-size="16">instead. 27 sections. Offline-ready PWA. No AI gimmicks.</text>

